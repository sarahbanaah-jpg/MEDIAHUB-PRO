name: Android PR verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
