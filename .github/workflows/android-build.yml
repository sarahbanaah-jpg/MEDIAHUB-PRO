name: MEDIAHUB-PRO Android build and release

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract original source and apply v2.8 maintenance patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediahub-source"
          unzip -q MEDIAHUB_PRO_UPDATE_CHECKER_SOURCE.zip -d "$RUNNER_TEMP/mediahub-source"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/mediahub-source" -name settings.gradle -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle"
          base64 -d release_patches/v2.8-maintenance.patch.gz.b64 | gzip -dc | (cd "$PROJECT_DIR" && patch --batch -p2)
          (cd "$PROJECT_DIR" && patch --batch -p2 < "$GITHUB_WORKSPACE/release_patches/v2.8-activity-result-fix.patch")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate package and update version
        run: |
          grep -q "applicationId 'com.mediahub.rebuilt'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '2.8'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 8" "$PROJECT_DIR/app/build.gradle"
          grep -q 'SharingActivity' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Apply December 16 service suspension screen and set v2.12
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          import re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          gradle = root / "app/build.gradle"
          build = gradle.read_text()
          build, n1 = re.subn(r"""versionName\s+['"]2\.8['"]""", "versionName '2.12'", build, count=1)
          build, n2 = re.subn(r"versionCode\s+8\b", "versionCode 12", build, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set maintenance build version 2.12/code 12.")
          gradle.write_text(build)

          candidates = list((root / "app/src/main/java").rglob("MainActivity.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(candidates)}")
          activity = candidates[0]
          source = activity.read_text()
          import re
          match = re.search(r"super\.onCreate\s*\([^;]*\);", source)
          if not match:
              raise SystemExit("Could not locate the superclass onCreate call in MainActivity.")
          marker_end = match.end()
          notice = '''
                  new android.app.AlertDialog.Builder(this)
                          .setTitle("SERVICE NOTICE — TEMPORARILY DISCONTINUED")
                          .setMessage("MEDIAHUB-PRO is temporarily unavailable while we complete a full rebuild and stability programme. App features are disabled during maintenance. We are targeting 16 December 2026 to return with a verified update. Thank you for your patience.")
                          .setCancelable(false)
                          .setPositiveButton("Close app", (dialog, which) -> finish())
                          .show();
                  return;
          '''
          source = source[:marker_end] + "\n" + notice + source[marker_end:]
          activity.write_text(source)
          print(f"Maintenance lock enabled in {activity}; version 2.12/code 12.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" :app:assembleDebug

      - name: Verify debug APK and checksum
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.12-maintenance-test
          path: ${{ runner.temp }}/mediahub-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing MEDIAHUB_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ENCRYPTION_PASSWORD" || { echo "Missing MEDIAHUB_KEY_ENCRYPTION_PASSWORD repository secret."; exit 1; }
          test -s signing/mediahub-release.jks.enc

      - name: Decrypt the existing MEDIAHUB-PRO release key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/mediahub-release.jks.enc \
            -out /tmp/mediahub-release.jks \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 /tmp/mediahub-release.jks

      - name: Configure release signing without changing the application identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          marker = "\n}\n\ndependencies"
          signing = """
              signingConfigs {
                  release {
                      storeFile file("/tmp/mediahub-release.jks")
                      storePassword System.getenv("MEDIAHUB_KEYSTORE_PASSWORD")
                      keyAlias "mediahub"
                      keyPassword System.getenv("MEDIAHUB_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }"""
          if "signingConfigs {" not in s:
              if marker not in s:
                  raise SystemExit("Could not locate Android block for release signing.")
              s = s.replace(marker, signing + marker, 1)
          p.write_text(s)
          PY

      - name: Build signed v2.12 maintenance APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MEDIAHUB_KEYSTORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" :app:assembleRelease

      - name: Verify v2.12 APK signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish MEDIAHUB-PRO v2.12 maintenance update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.12
          name: MEDIAHUB-PRO v2.12 — Maintenance notice
          body: |
            MEDIAHUB-PRO v2.12 — TEMPORARY SERVICE SUSPENSION

            This update intentionally blocks access to app features during the rebuild.

            - The app displays a mandatory service notice and closes when the user taps Close app.
            - Music, video, photo and other app functions are unavailable during maintenance.
            - Target return date: 16 December 2026. This is a target, not a guarantee.
            - A verified replacement will be published only after startup and core playback testing pass.

            Signed with the existing MEDIAHUB-PRO release key. Android will ask you to confirm installation.
          files: ${{ runner.temp }}/mediahub-source/**/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
