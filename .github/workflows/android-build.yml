name: MEDIAHUB-PRO Android verification (unreleased)

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediahub-pro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/mediahub/rebuilt
          test ! -f app/build.gradle
          grep -q 'applicationId = "com.mediahub.rebuilt"' app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "2.14.0"' app/build.gradle.kts
          ! grep -R -n 'mediahub-demo.mp4\|Play included offline demo clip\|PLAY INCLUDED OFFLINE DEMO CLIP' app/src/main

      - name: Build debug APK for testing only
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify test APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c %s "$APK")"
          MINIMUM=$((4 * 1024 * 1024))
          test "$SIZE" -ge "$MINIMUM" || { echo "Test APK unexpectedly small: $SIZE bytes"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mediahub.rebuilt' versionCode='23' versionName='2.14.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload unreleased test APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.14.0-unreleased-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
