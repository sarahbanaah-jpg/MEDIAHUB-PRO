name: MEDIAHUB-PRO Android verification (unreleased)
# Signed candidate remains gated to feature/complete-mediahub-fix; no public release is created.

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediahub-pro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/mediahub/rebuilt
          test ! -f app/build.gradle
          grep -q 'applicationId = "com.mediahub.rebuilt"' app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "2.14.0"' app/build.gradle.kts
          ! grep -R -n 'mediahub-demo.mp4\|Play included offline demo clip\|PLAY INCLUDED OFFLINE DEMO CLIP' app/src/main

      - name: Build debug APK for testing
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug test APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c %s "$APK")"
          test "$SIZE" -ge $((4 * 1024 * 1024))
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mediahub.rebuilt' versionCode='23' versionName='2.14.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.14.0-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Build a signed candidate for in-place upgrade testing, but do not create a GitHub Release.
      - name: Validate existing signing secrets
        if: github.ref == 'refs/heads/feature/complete-mediahub-fix'
        env:
          STORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing MEDIAHUB_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ENCRYPTION_PASSWORD" || { echo "Missing MEDIAHUB_KEY_ENCRYPTION_PASSWORD secret"; exit 1; }
          test -s signing/mediahub-release.jks.enc

      - name: Decrypt existing release signing key
        if: github.ref == 'refs/heads/feature/complete-mediahub-fix'
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/mediahub-release.jks.enc \
            -out /tmp/mediahub-release.jks \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 /tmp/mediahub-release.jks

      - name: Build signed unreleased candidate
        if: github.ref == 'refs/heads/feature/complete-mediahub-fix'
        env:
          MEDIAHUB_KEYSTORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed candidate identity and signature
        if: github.ref == 'refs/heads/feature/complete-mediahub-fix'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$(stat -c %s "$APK")" -ge $((4 * 1024 * 1024))
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mediahub.rebuilt' versionCode='23' versionName='2.14.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload signed unreleased candidate (not published)
        if: github.ref == 'refs/heads/feature/complete-mediahub-fix'
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.14.0-signed-unreleased-candidate
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
