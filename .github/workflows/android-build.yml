name: MEDIAHUB-PRO Android validation build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract original source and apply v2.8 maintenance patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediahub-source"
          unzip -q MEDIAHUB_PRO_UPDATE_CHECKER_SOURCE.zip -d "$RUNNER_TEMP/mediahub-source"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/mediahub-source" -name settings.gradle -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle"
          base64 -d release_patches/v2.8-maintenance.patch.gz.b64 | gzip -dc | (cd "$PROJECT_DIR" && patch --batch -p2)
          (cd "$PROJECT_DIR" && patch --batch -p2 < "$GITHUB_WORKSPACE/release_patches/v2.8-activity-result-fix.patch")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate package and update version
        run: |
          grep -q "applicationId 'com.mediahub.rebuilt'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionName '2.8'" "$PROJECT_DIR/app/build.gradle"
          grep -q "versionCode 8" "$PROJECT_DIR/app/build.gradle"
          grep -q 'SharingActivity' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build debug APK
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK and checksum
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.8-debug-test
          path: ${{ runner.temp }}/mediahub-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
