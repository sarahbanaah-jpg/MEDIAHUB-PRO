name: MEDIAHUB-PRO Android build and release

on:
  push:
    branches: [ main, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract original source and apply v2.8 maintenance patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediahub-source"
          unzip -q MEDIAHUB_PRO_UPDATE_CHECKER_SOURCE.zip -d "$RUNNER_TEMP/mediahub-source"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/mediahub-source" -name settings.gradle -print -quit)")"
          test -f "$PROJECT_DIR/app/build.gradle"
          base64 -d release_patches/v2.8-maintenance.patch.gz.b64 | gzip -dc | (cd "$PROJECT_DIR" && patch --batch -p2)
          (cd "$PROJECT_DIR" && patch --batch -p2 < "$GITHUB_WORKSPACE/release_patches/v2.8-activity-result-fix.patch")
          base64 -d release_patches/v2.9-offline-nearby.patch.gz.b64 | gzip -dc | (cd "$PROJECT_DIR" && patch --batch -p1)
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          
          source = Path(sys.argv[1]) / "app/src/main/java/com/mediahub/rebuilt/NearbyTransferActivity.java"
          if not source.is_file():
              raise SystemExit(f"Nearby transfer source not found: {source}")
          
          text = source.read_text()
          needle = "final String finalName=name.replaceAll("
          if text.count(needle) != 1:
              raise SystemExit(f"Expected exactly one unsafe filename regex; found {text.count(needle)}")
          
          start = text.index(needle)
          end = text.index(";", start) + 1
          text = text[:start] + "final String finalName = sanitizeFileName(name);" + text[end:]
          
          marker = "private void saveIncoming("
          if text.count(marker) != 1:
              raise SystemExit(f"Expected exactly one saveIncoming method; found {text.count(marker)}")
          
          method = r'''private static String sanitizeFileName(String name) {
              StringBuilder safe = new StringBuilder(name.length());
              for (int i = 0; i < name.length(); i++) {
                  char ch = name.charAt(i);
                  if (ch == '/' || ch == '\\' || Character.isISOControl(ch)) {
                      safe.append('_');
                  } else {
                      safe.append(ch);
                  }
              }
              String result = safe.toString().trim();
              return result.isEmpty() ? "mediahub-file" : result;
          }
          
          '''
          unsupported_api = "&&update.getPayloadType()==Payload.Type.FILE"
          if text.count(unsupported_api) != 1:
              raise SystemExit(f"Expected exactly one unsupported Nearby API call; found {text.count(unsupported_api)}")
          text = text.replace(unsupported_api, "", 1)
          text = text.replace(marker, method + marker, 1)
          source.write_text(text)
          print("Fixed filename sanitization using character checks; no regex escaping required.")
          PY
          # Install a real local video player and connect it to the video library.
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])
          java_dir = project / "app/src/main/java/com/mediahub/rebuilt"
          res_dir = project / "app/src/main/res/layout"
          manifest = project / "app/src/main/AndroidManifest.xml"
          library = java_dir / "LibraryActivity.java"
          player = java_dir / "VideoPlayerActivity.java"

          if not library.is_file() or not manifest.is_file():
              raise SystemExit("Required library or manifest source is missing.")

          # Route video selections to the dedicated player instead of the generic open handler.
          source = library.read_text()
          old = 'if(a.startsWith("Play")||a.equals("View photo"))open(m);'
          new = '''if(a.startsWith("Play")||a.equals("View photo")) {
                      if(kind==KIND_VIDEO) {
                          Intent videoIntent=new Intent(this,VideoPlayerActivity.class);
                          videoIntent.setData(m.uri);
                          videoIntent.putExtra("title",m.title);
                          startActivity(videoIntent);
                      } else open(m);
                  }'''
          if old in source:
              source = source.replace(old, new, 1)
          elif "VideoPlayerActivity.class" not in source:
              raise SystemExit("Could not safely locate the library's Play/View action; video launch not patched.")
          library.write_text(source)

          # Register the dedicated player once.
          m = manifest.read_text()
          if ".VideoPlayerActivity" not in m:
              marker = "</application>"
              if m.count(marker) != 1:
                  raise SystemExit("Could not locate the application manifest closing tag.")
              m = m.replace(marker, '        <activity android:name=".VideoPlayerActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden"/>\n    ' + marker, 1)
              manifest.write_text(m)

          player.write_text(r'''package com.mediahub.rebuilt;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.VideoView;
          import android.widget.MediaController;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class VideoPlayerActivity extends Activity {
              private VideoView video;
              private SeekBar seek;
              private TextView title, elapsed, duration;
              private Button play, previous, next, fullscreen;
              private final Handler handler = new Handler();
              private final ArrayList<MediaItem> queue = new ArrayList<>();
              private int index = -1;
              private boolean seeking = false;
              private boolean controlsVisible = true;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setContentView(R.layout.activity_video);
                  video = findViewById(R.id.videoView);
                  seek = findViewById(R.id.videoSeek);
                  title = findViewById(R.id.videoTitle);
                  elapsed = findViewById(R.id.videoElapsed);
                  duration = findViewById(R.id.videoDuration);
                  play = findViewById(R.id.videoPlay);
                  previous = findViewById(R.id.videoPrevious);
                  next = findViewById(R.id.videoNext);
                  fullscreen = findViewById(R.id.videoFullscreen);

                  List<MediaItem> items = MediaRepository.query(this, LibraryActivity.KIND_VIDEO);
                  if (items != null) queue.addAll(items);
                  Uri requested = getIntent().getData();
                  String wanted = requested == null ? null : requested.toString();
                  for (int i=0; i<queue.size(); i++) {
                      if (queue.get(i).uri.toString().equals(wanted)) { index=i; break; }
                  }
                  if (index < 0 && requested != null) {
                      MediaItem selected = null;
                      for (MediaItem item : queue) if (item.uri.toString().equals(wanted)) selected=item;
                      if (selected != null) index=queue.indexOf(selected);
                  }
                  title.setText(getIntent().getStringExtra("title") == null ? "MEDIAHUB PRO VIDEO" : getIntent().getStringExtra("title"));
                  video.setMediaController(new MediaController(this));
                  video.setOnPreparedListener(mp -> {
                          duration.setText(time(video.getDuration()));
                      seek.setMax(Math.max(1, video.getDuration()));
                      play.setText("Ⅱ");
                      handler.post(updateTask);
                  });
                  video.setOnCompletionListener(mp -> playNext(true));
                  video.setOnErrorListener((mp,what,extra)->{
                      Toast.makeText(this,"This video could not be played.",Toast.LENGTH_LONG).show();
                      play.setText("▶");
                      return true;
                  });
                  play.setOnClickListener(v -> togglePlayback());
                  previous.setOnClickListener(v -> playPrevious());
                  next.setOnClickListener(v -> playNext(false));
                  fullscreen.setOnClickListener(v -> toggleFullscreen());
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onStartTrackingTouch(SeekBar b){seeking=true;}
                      public void onProgressChanged(SeekBar b,int value,boolean user){if(user)elapsed.setText(time(value));}
                      public void onStopTrackingTouch(SeekBar b){video.seekTo(b.getProgress());seeking=false;}
                  });
                  if (requested != null) startVideo(requested);
                  else if (!queue.isEmpty()) startAt(0);
                  else { Toast.makeText(this,"No videos found.",Toast.LENGTH_LONG).show(); finish(); }
              }

              private void startAt(int position) {
                  if (position < 0 || position >= queue.size()) return;
                  index=position;
                  MediaItem item=queue.get(index);
                  title.setText(item.title == null ? "MEDIAHUB PRO VIDEO" : item.title);
                  startVideo(item.uri);
              }
              private void startVideo(Uri uri) {
                  if (uri == null) return;
                  video.setVideoURI(uri);
                  video.start();
                  play.setText("Ⅱ");
                  handler.post(updateTask);
              }
              private void togglePlayback() {
                  if (video.isPlaying()) { video.pause(); play.setText("▶"); }
                  else { video.start(); play.setText("Ⅱ"); handler.post(updateTask); }
              }
              private void playNext(boolean automatic) {
                  if (queue.isEmpty()) { if (automatic) finish(); return; }
                  if (index < 0) index=0;
                  else if (index+1 < queue.size()) index++;
                  else if (automatic) { video.seekTo(0); video.pause(); play.setText("▶"); return; }
                  else index=0;
                  startAt(index);
              }
              private void playPrevious() {
                  if (video.getCurrentPosition()>3000) { video.seekTo(0); return; }
                  if (queue.isEmpty()) { video.seekTo(0); return; }
                  index = index <= 0 ? queue.size()-1 : index-1;
                  startAt(index);
              }
              private final Runnable updateTask = new Runnable() {
                  @Override public void run() {
                      if (video != null && video.isPlaying()) {
                          if (!seeking) seek.setProgress(video.getCurrentPosition());
                          elapsed.setText(time(video.getCurrentPosition()));
                          handler.postDelayed(this,500);
                      }
                  }
              };
              private String time(int ms) {
                  int seconds=Math.max(0,ms/1000), h=seconds/3600, m=(seconds%3600)/60, s=seconds%60;
                  return h>0 ? String.format(Locale.getDefault(),"%d:%02d:%02d",h,m,s) : String.format(Locale.getDefault(),"%d:%02d",m,s);
              }
              private void toggleFullscreen() {
                  controlsVisible=!controlsVisible;
                  if (controlsVisible) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }
              @Override protected void onPause() { super.onPause(); if(video!=null && video.isPlaying()){video.pause();play.setText("▶");} }
              @Override protected void onDestroy() { handler.removeCallbacks(updateTask); super.onDestroy(); }
          }
          ''')

          (res_dir / "activity_video.xml").write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:background="#050507">
              <LinearLayout android:layout_width="match_parent" android:layout_height="56dp"
                  android:gravity="center_vertical" android:paddingHorizontal="16dp" android:background="#101014">
                  <TextView android:id="@+id/videoTitle" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="MEDIAHUB PRO VIDEO" android:textColor="#FFFFFF"
                      android:textStyle="bold" android:textSize="15sp" android:maxLines="1"/>
                  <Button android:id="@+id/videoFullscreen" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="⛶" android:textColor="#FFFFFF" android:backgroundTint="#29212B"/>
              </LinearLayout>
              <VideoView android:id="@+id/videoView" android:layout_width="match_parent"
                  android:layout_height="0dp" android:layout_weight="1" android:background="#000000"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:paddingHorizontal="16dp" android:paddingTop="10dp"
                  android:paddingBottom="14dp" android:background="#111014">
                  <SeekBar android:id="@+id/videoSeek" android:layout_width="match_parent"
                      android:layout_height="wrap_content" android:progressTint="#FF3475" android:thumbTint="#FF4771"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content">
                      <TextView android:id="@+id/videoElapsed" android:layout_width="0dp" android:layout_height="wrap_content"
                          android:layout_weight="1" android:text="0:00" android:textColor="#C9C2CB"/>
                      <TextView android:id="@+id/videoDuration" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="0:00" android:textColor="#C9C2CB"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:gravity="center" android:orientation="horizontal" android:paddingTop="8dp">
                      <Button android:id="@+id/videoPrevious" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="|◀" android:textColor="#FFFFFF" android:backgroundTint="#29212B"/>
                      <Button android:id="@+id/videoPlay" android:layout_width="76dp" android:layout_height="56dp"
                          android:text="Ⅱ" android:textSize="20sp" android:textColor="#FFFFFF" android:backgroundTint="#F52E67"/>
                      <Button android:id="@+id/videoNext" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:text="▶|" android:textColor="#FFFFFF" android:backgroundTint="#29212B"/>
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          ''', encoding="utf-8")
          print("Installed dedicated full-screen video playback, seek/progress controls, previous/next, completion advance and library routing.")
          PY

          # Deep v2.11 fixes: route the selected URI, decode real video frames, and add the one-time launch announcement.
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])
          java_dir = project / "app/src/main/java/com/mediahub/rebuilt"
          layout_dir = project / "app/src/main/res/layout"
          drawable_dir = project / "app/src/main/res/drawable"
          library = java_dir / "LibraryActivity.java"
          main = java_dir / "MainActivity.java"
          row = layout_dir / "row_media.xml"

          # The normal tap path used an Intent extra while the player read only Intent.data.
          # Pass both the selected URI and title, so the exact tapped video is opened.
          source = library.read_text()
          broken_route = 'else if(kind==KIND_VIDEO){Intent i=new Intent(this,VideoPlayerActivity.class);i.putExtra("uri",m.uri.toString());startActivity(i);}'
          fixed_route = 'else if(kind==KIND_VIDEO){Intent i=new Intent(this,VideoPlayerActivity.class);i.setData(m.uri);i.putExtra("uri",m.uri.toString());i.putExtra("title",m.title);startActivity(i);}'
          if broken_route in source:
              source = source.replace(broken_route, fixed_route, 1)
          elif fixed_route not in source:
              raise SystemExit("Could not find the standard video-tap route; refusing an unsafe patch.")

          # Replace the generic-logo row binding with asynchronous, cached video-frame thumbnails.
          old_adapter_start = "    private class MediaAdapter extends ArrayAdapter<MediaItem>{"
          old_adapter_end = "    private class PhotoAdapter extends ArrayAdapter<MediaItem> {"
          if source.count(old_adapter_start) != 1 or source.count(old_adapter_end) != 1:
              raise SystemExit("Could not safely locate MediaAdapter for thumbnail replacement.")
          a = source.index(old_adapter_start)
          b = source.index(old_adapter_end, a)
          adapter = r'''    private final android.util.LruCache<String, Bitmap> videoThumbnailCache =
              new android.util.LruCache<String, Bitmap>(8 * 1024) {
                  @Override protected int sizeOf(String key, Bitmap value) {
                      return Math.max(1, value.getByteCount() / 1024);
                  }
              };

          private class MediaAdapter extends ArrayAdapter<MediaItem>{
              MediaAdapter(){super(LibraryActivity.this,0,shown);}
              @Override public android.view.View getView(int position,android.view.View convert,android.view.ViewGroup parent){
                  android.view.View row=convert;
                  if(row==null) row=getLayoutInflater().inflate(R.layout.row_media,parent,false);
                  MediaItem item=getItem(position);
                  ((TextView)row.findViewById(R.id.rowTitle)).setText(item.title);
                  String sub=item.artist==null||item.artist.trim().isEmpty()?item.mime:item.artist;
                  ((TextView)row.findViewById(R.id.rowSubtitle)).setText(sub==null?"On this device":sub);
                  ((TextView)row.findViewById(R.id.rowGlyph)).setText(kind==KIND_VIDEO?"▷":kind==KIND_PHOTO?"▧":"♫");
                  ImageView artwork=row.findViewById(R.id.rowThumbnail);
                  if(kind==KIND_VIDEO) bindVideoThumbnail(item,artwork);
                  else {
                      artwork.setTag(null);
                      artwork.setImageResource(R.drawable.ic_mediahub);
                      artwork.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  }
                  return row;
              }
          }

          private void bindVideoThumbnail(MediaItem item, ImageView image) {
              final String key = item.uri.toString();
              image.setTag(key);
              image.setScaleType(ImageView.ScaleType.CENTER_CROP);
              Bitmap cached = videoThumbnailCache.get(key);
              if (cached != null && !cached.isRecycled()) {
                  image.setImageBitmap(cached);
                  return;
              }
              image.setImageDrawable(null);
              image.setBackgroundColor(0xFF202027);
              thumbnailExecutor.execute(() -> {
                  Bitmap frame = extractVideoThumbnail(item.uri);
                  if (frame == null) return;
                  videoThumbnailCache.put(key, frame);
                  runOnUiThread(() -> {
                      if (!isFinishing() && key.equals(image.getTag())) image.setImageBitmap(frame);
                  });
              });
          }

          private Bitmap extractVideoThumbnail(android.net.Uri uri) {
              android.media.MediaMetadataRetriever retriever = new android.media.MediaMetadataRetriever();
              try {
                  retriever.setDataSource(getContentResolver(), uri);
                  Bitmap frame = null;
                  if (Build.VERSION.SDK_INT >= 27) {
                      frame = retriever.getScaledFrameAtTime(1_000_000L,
                          android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC, 384, 216);
                  }
                  if (frame == null) {
                      frame = retriever.getFrameAtTime(1_000_000L,
                          android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                  }
                  if (frame == null) {
                      if (Build.VERSION.SDK_INT >= 27) {
                          frame = retriever.getScaledFrameAtTime(0L,
                              android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC, 384, 216);
                      } else {
                          frame = retriever.getFrameAtTime(0L,
                              android.media.MediaMetadataRetriever.OPTION_CLOSEST_SYNC);
                      }
                  }
                  if (frame == null) return null;
                  int w = frame.getWidth(), h = frame.getHeight();
                  float scale = Math.min(1f, Math.min(384f / Math.max(1,w), 216f / Math.max(1,h)));
                  if (scale < 1f) {
                      Bitmap scaled = Bitmap.createScaledBitmap(frame,
                          Math.max(1,Math.round(w*scale)), Math.max(1,Math.round(h*scale)), true);
                      if (scaled != frame) frame.recycle();
                      frame = scaled;
                  }
                  return frame;
              } catch (Exception ignored) {
                  return null;
              } finally {
                  try { retriever.release(); } catch (Exception ignored) { }
              }
          }

          '''
          source = source[:a] + adapter + source[b:]
          library.write_text(source)

          # Remove the app-logo placeholder from video rows and give the image a stable recycling ID.
          xml = row.read_text()
          xml = xml.replace('<ImageView android:layout_width="48dp" android:layout_height="48dp" android:src="@drawable/ic_mediahub"',
                            '<ImageView android:id="@+id/rowThumbnail" android:layout_width="48dp" android:layout_height="48dp"')
          if 'android:id="@+id/rowThumbnail"' not in xml:
              raise SystemExit("Could not add rowThumbnail ID to row_media.xml.")
          row.write_text(xml)

          # Harden the player lifecycle: wait for OnPrepared before starting, support both URI forms,
          # surface decoder failures, and stop attaching a second overlapping MediaController.
          player = java_dir / "VideoPlayerActivity.java"
          player.write_text(r'''package com.mediahub.rebuilt;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.VideoView;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class VideoPlayerActivity extends Activity {
              private VideoView video;
              private SeekBar seek;
              private TextView title, elapsed, duration, status;
              private Button play, previous, next, fullscreen;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ArrayList<MediaItem> queue = new ArrayList<>();
              private int index = -1;
              private boolean seeking = false;
              private boolean prepared = false;
              private boolean playWhenReady = true;
              private boolean resumeAfterPause = false;
              private boolean controlsVisible = true;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setContentView(R.layout.activity_video);
                  video = findViewById(R.id.videoView);
                  seek = findViewById(R.id.videoSeek);
                  title = findViewById(R.id.videoTitle);
                  elapsed = findViewById(R.id.videoElapsed);
                  duration = findViewById(R.id.videoDuration);
                  status = findViewById(R.id.videoStatus);
                  play = findViewById(R.id.videoPlay);
                  previous = findViewById(R.id.videoPrevious);
                  next = findViewById(R.id.videoNext);
                  fullscreen = findViewById(R.id.videoFullscreen);

                  List<MediaItem> items = MediaRepository.query(this, LibraryActivity.KIND_VIDEO);
                  if (items != null) queue.addAll(items);

                  Uri requested = getIntent().getData();
                  if (requested == null) {
                      String extraUri = getIntent().getStringExtra("uri");
                      if (extraUri != null && !extraUri.trim().isEmpty()) {
                          try { requested = Uri.parse(extraUri); } catch (Exception ignored) { }
                      }
                  }
                  String wanted = requested == null ? null : requested.toString();
                  if (wanted != null) {
                      for (int i=0; i<queue.size(); i++) {
                          if (queue.get(i).uri != null && wanted.equals(queue.get(i).uri.toString())) {
                              index = i;
                              break;
                          }
                      }
                  }

                  String requestedTitle = getIntent().getStringExtra("title");
                  title.setText(requestedTitle == null || requestedTitle.trim().isEmpty()
                      ? "MEDIAHUB PRO VIDEO" : requestedTitle);

                  video.setOnPreparedListener(mp -> {
                      prepared = true;
                      status.setVisibility(View.GONE);
                      int total = video.getDuration();
                      duration.setText(time(total));
                      seek.setMax(Math.max(1,total));
                      if (playWhenReady) {
                          video.start();
                          play.setText("Ⅱ");
                          handler.removeCallbacks(updateTask);
                          handler.post(updateTask);
                      } else {
                          play.setText("▶");
                      }
                  });

                  video.setOnCompletionListener(mp -> playNext(true));
                  video.setOnErrorListener((mp, what, extra) -> {
                      prepared = false;
                      handler.removeCallbacks(updateTask);
                      play.setText("▶");
                      status.setText("This video could not be decoded. The file may use a format or codec that this device does not support.");
                      status.setVisibility(View.VISIBLE);
                      return true;
                  });

                  play.setOnClickListener(v -> togglePlayback());
                  previous.setOnClickListener(v -> playPrevious());
                  next.setOnClickListener(v -> playNext(false));
                  fullscreen.setOnClickListener(v -> toggleFullscreen());
                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onStartTrackingTouch(SeekBar b) { if (prepared) seeking=true; }
                      @Override public void onProgressChanged(SeekBar b,int value,boolean user) {
                          if (user) elapsed.setText(time(value));
                      }
                      @Override public void onStopTrackingTouch(SeekBar b) {
                          if (prepared) video.seekTo(b.getProgress());
                          seeking=false;
                      }
                  });

                  if (requested != null) {
                      startVideo(requested);
                  } else if (!queue.isEmpty()) {
                      startAt(0);
                  } else {
                      status.setText("No videos were found. Add a media folder or check video access in Android settings.");
                      status.setVisibility(View.VISIBLE);
                      play.setEnabled(false);
                      previous.setEnabled(false);
                      next.setEnabled(false);
                  }
              }

              private void startAt(int position) {
                  if (position < 0 || position >= queue.size()) return;
                  index = position;
                  MediaItem item = queue.get(index);
                  title.setText(item.title == null ? "MEDIAHUB PRO VIDEO" : item.title);
                  startVideo(item.uri);
              }

              private void startVideo(Uri uri) {
                  if (uri == null) return;
                  handler.removeCallbacks(updateTask);
                  prepared = false;
                  playWhenReady = true;
                  seeking = false;
                  seek.setProgress(0);
                  elapsed.setText("0:00");
                  duration.setText("0:00");
                  play.setText("…");
                  status.setText("Preparing video…");
                  status.setVisibility(View.VISIBLE);
                  try {
                      video.stopPlayback();
                      video.setVideoURI(uri);
                  } catch (RuntimeException e) {
                      status.setText("Unable to open this video. Check that the file still exists and MEDIAHUB PRO has access.");
                      status.setVisibility(View.VISIBLE);
                      play.setText("▶");
                  }
              }

              private void togglePlayback() {
                  if (!prepared) {
                      playWhenReady = !playWhenReady;
                      play.setText(playWhenReady ? "…" : "▶");
                      return;
                  }
                  if (video.isPlaying()) {
                      video.pause();
                      play.setText("▶");
                      handler.removeCallbacks(updateTask);
                  } else {
                      video.start();
                      play.setText("Ⅱ");
                      handler.removeCallbacks(updateTask);
                      handler.post(updateTask);
                  }
              }

              private void playNext(boolean automatic) {
                  if (queue.isEmpty()) return;
                  if (index < 0) index = 0;
                  else if (index + 1 < queue.size()) index++;
                  else if (automatic) {
                      if (prepared) {
                          video.seekTo(0);
                          video.pause();
                      }
                      play.setText("▶");
                      handler.removeCallbacks(updateTask);
                      return;
                  } else index = 0;
                  startAt(index);
              }

              private void playPrevious() {
                  if (prepared && video.getCurrentPosition() > 3000) {
                      video.seekTo(0);
                      return;
                  }
                  if (queue.isEmpty()) {
                      if (prepared) video.seekTo(0);
                      return;
                  }
                  index = index <= 0 ? queue.size()-1 : index-1;
                  startAt(index);
              }

              private final Runnable updateTask = new Runnable() {
                  @Override public void run() {
                      if (prepared && video != null && video.isPlaying()) {
                          if (!seeking) seek.setProgress(video.getCurrentPosition());
                          elapsed.setText(time(video.getCurrentPosition()));
                          handler.postDelayed(this,500);
                      }
                  }
              };

              private String time(int ms) {
                  int seconds=Math.max(0,ms/1000), h=seconds/3600, m=(seconds%3600)/60, s=seconds%60;
                  return h>0
                      ? String.format(Locale.getDefault(),"%d:%02d:%02d",h,m,s)
                      : String.format(Locale.getDefault(),"%d:%02d",m,s);
              }

              private void toggleFullscreen() {
                  controlsVisible = !controlsVisible;
                  if (controlsVisible) {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              @Override protected void onPause() {
                  if (prepared && video != null && video.isPlaying()) {
                      resumeAfterPause = true;
                      video.pause();
                      play.setText("▶");
                      handler.removeCallbacks(updateTask);
                  }
                  super.onPause();
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (resumeAfterPause && prepared && video != null) {
                      resumeAfterPause = false;
                      video.start();
                      play.setText("Ⅱ");
                      handler.removeCallbacks(updateTask);
                      handler.post(updateTask);
                  }
              }

              @Override protected void onDestroy() {
                  handler.removeCallbacks(updateTask);
                  if (video != null) video.stopPlayback();
                  super.onDestroy();
              }
          }
          ''')

