name: MEDIAHUB-PRO Android build and release

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Select the Kotlin Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java/com/mediahub/rebuilt
          # The legacy Groovy module file was retired; only the Kotlin DSL is supported.
          test ! -f app/build.gradle
          grep -q 'applicationId = "com.mediahub.rebuilt"' app/build.gradle.kts
          grep -q 'versionCode = 21' app/build.gradle.kts
          grep -q 'versionName = "2.13.0"' app/build.gradle.kts

      - name: Generate bundled offline demo media
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash scripts/create-demo-asset.sh

      - name: Build debug APK from Kotlin source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify debug APK package and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c %s "$APK")"
          MINIMUM=$((20 * 1024 * 1024))
          test "$SIZE" -ge "$MINIMUM" || { echo "Debug APK is below 20 MiB: $SIZE bytes"; exit 1; }
          echo "Verified debug APK size: $SIZE bytes"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mediahub.rebuilt'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v2.13-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing MEDIAHUB_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ENCRYPTION_PASSWORD" || { echo "Missing MEDIAHUB_KEY_ENCRYPTION_PASSWORD repository secret."; exit 1; }
          test -s signing/mediahub-release.jks.enc

      - name: Decrypt the existing MEDIAHUB-PRO release key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/mediahub-release.jks.enc \
            -out /tmp/mediahub-release.jks \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 /tmp/mediahub-release.jks

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MEDIAHUB_KEYSTORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK identity and signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIZE="$(stat -c %s "$APK")"
          MINIMUM=$((20 * 1024 * 1024))
          test "$SIZE" -ge "$MINIMUM" || { echo "Release APK is below 20 MiB: $SIZE bytes"; exit 1; }
          echo "Verified signed release APK size: $SIZE bytes"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mediahub.rebuilt' versionCode='21' versionName='2.13.0'"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publish MEDIAHUB-PRO v2.13
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.13
          name: MEDIAHUB-PRO v2.13 — Kotlin rebuild
          body: |
            MEDIAHUB-PRO v2.13.0

            This release is built from the Kotlin Android project in the repository, not the retired legacy maintenance source.

            - Application ID: com.mediahub.rebuilt
            - Version code: 21
            - Uses the existing MEDIAHUB-PRO release signing key.
            - Includes the current Kotlin UI and Media3 playback implementation.
            - Please report any startup or playback issue before wider distribution.

            This build has passed CI compilation and APK signature/package checks. Device-level playback testing is still required.
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
