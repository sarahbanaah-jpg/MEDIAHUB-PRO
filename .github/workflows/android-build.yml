          (java_dir / "CometosAnnouncement.java").write_text(r'''package com.mediahub.rebuilt;

          import android.app.Activity;
          import android.app.Dialog;
          import android.graphics.Color;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.AnimatorSet;
          import android.animation.ObjectAnimator;
          import android.widget.TextView;
          import java.util.Calendar;
          import java.util.TimeZone;

          public final class CometosAnnouncement {
              private static final String PREFS = "mediahub_cometos";
              private static final String SHOWN = "launcher7_announcement_shown";
              private static final TimeZone NAIROBI = TimeZone.getTimeZone("Africa/Nairobi");
              private CometosAnnouncement() {}

              public static void showIfNeeded(Activity activity) {
                  if (activity == null || activity.isFinishing() || activity.isDestroyed()) return;
                  android.content.SharedPreferences prefs = activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE);
                  if (prefs.getBoolean(SHOWN, false)) return;
                  prefs.edit().putBoolean(SHOWN, true).apply();

                  Dialog dialog = new Dialog(activity);
                  dialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
                  dialog.setContentView(R.layout.dialog_cometos_announcement);
                  dialog.setCancelable(true);
                  dialog.setCanceledOnTouchOutside(false);
                  Window window = dialog.getWindow();
                  if (window != null) {
                      window.setBackgroundDrawableResource(android.R.color.transparent);
                      window.addFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND);
                      WindowManager.LayoutParams params = window.getAttributes();
                      params.dimAmount = 0.78f;
                      window.setAttributes(params);
                  }

                  View card = dialog.findViewById(R.id.announcementCard);
                  View accent = dialog.findViewById(R.id.announcementAccent);
                  TextView headline = dialog.findViewById(R.id.announcementHeadline);
                  TextView description = dialog.findViewById(R.id.announcementDescription);
                  TextView launchLabel = dialog.findViewById(R.id.announcementLaunchLabel);
                  TextView countdown = dialog.findViewById(R.id.announcementCountdown);
                  View close = dialog.findViewById(R.id.announcementClose);

                  long launchAt = launchTime();
                  boolean upcoming = System.currentTimeMillis() < launchAt;
                  headline.setText(upcoming ? "A NEW EXPERIENCE IS COMING" : "A NEW EXPERIENCE IS HERE");
                  description.setText(upcoming
                      ? "The next generation of your launcher experience is almost here."
                      : "The next generation of your launcher experience has arrived.");
                  launchLabel.setText(upcoming ? "LAUNCHING TONIGHT" : "NOW AVAILABLE");

                  Handler handler = new Handler(Looper.getMainLooper());
                  Runnable ticker = new Runnable() {
                      @Override public void run() {
                          long remaining = launchAt - System.currentTimeMillis();
                          if (remaining <= 0) {
                              countdown.setText("THE LAUNCH WINDOW IS OPEN");
                          } else {
                              long total = remaining / 1000L;
                              long days = total / 86400L;
                              long hours = (total % 86400L) / 3600L;
                              long minutes = (total % 3600L) / 60L;
                              long seconds = total % 60L;
                              String value = days > 0
                                  ? String.format(java.util.Locale.ROOT, "LAUNCH IN %dD %02dH %02dM", days, hours, minutes)
                                  : String.format(java.util.Locale.ROOT, "LAUNCH IN %02dH %02dM %02dS", hours, minutes, seconds);
                              countdown.setText(value);
                              handler.postDelayed(this, 1000L);
                          }
                      }
                  };

                  close.setOnClickListener(v -> dialog.dismiss());
                  dialog.setOnDismissListener(d -> handler.removeCallbacks(ticker));
                  dialog.show();
                  if (window != null) {
                      window.setLayout((int)(activity.getResources().getDisplayMetrics().widthPixels * 0.90f),
                          WindowManager.LayoutParams.WRAP_CONTENT);
                  }
                  card.setAlpha(0f);
                  card.setScaleX(0.92f);
                  card.setScaleY(0.92f);
                  card.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(520L)
                      .setInterpolator(new DecelerateInterpolator(1.6f)).start();

                  ObjectAnimator glow = ObjectAnimator.ofFloat(accent, View.ALPHA, 0.45f, 1f);
                  glow.setDuration(950L);
                  glow.setRepeatCount(ObjectAnimator.INFINITE);
                  glow.setRepeatMode(ObjectAnimator.REVERSE);
                  glow.start();

                  TextView brand = dialog.findViewById(R.id.announcementBrand);
                  ObjectAnimator brandIn = ObjectAnimator.ofFloat(brand, View.TRANSLATION_Y, 18f, 0f);
                  brandIn.setDuration(650L);
                  brandIn.setStartDelay(150L);
                  brandIn.setInterpolator(new DecelerateInterpolator(1.5f));
                  brandIn.start();

                  ticker.run();
              }

              private static long launchTime() {
                  Calendar c = Calendar.getInstance(NAIROBI);
                  c.set(Calendar.YEAR, 2026);
                  c.set(Calendar.MONTH, Calendar.NOVEMBER);
                  c.set(Calendar.DAY_OF_MONTH, 17);
                  c.set(Calendar.HOUR_OF_DAY, 1);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  return c.getTimeInMillis();
              }
          }
          ''')

