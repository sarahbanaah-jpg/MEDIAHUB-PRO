name: Publish MEDIAHUB PRO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Read version
        id: ver
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version $VERSION_NAME code $VERSION_CODE"

      - name: Skip if release exists
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release $TAG exists"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will publish $TAG"
          fi

      - name: Decrypt keystore
        if: steps.skip.outputs.skip == 'false'
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/mediahub-release.jks.enc \
            -out /tmp/mediahub-release.jks \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 /tmp/mediahub-release.jks

      - name: Build release APK
        if: steps.skip.outputs.skip == 'false'
        env:
          MEDIAHUB_KEYSTORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        if: steps.skip.outputs.skip == 'false'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep com.mediahub.rebuilt
          cp "$APK" MEDIAHUB-PRO-v${{ steps.ver.outputs.version_name }}.apk
          ls -lh MEDIAHUB-PRO-v${{ steps.ver.outputs.version_name }}.apk

      - name: Publish GitHub Release
        if: steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.ver.outputs.tag }}
          V=${{ steps.ver.outputs.version_name }}
          C=${{ steps.ver.outputs.version_code }}
          gh release create "$TAG" \
            "MEDIAHUB-PRO-v${V}.apk" \
            --title "MEDIAHUB-PRO v${V} Liquid Glass UI" \
            --notes "Premium Liquid Glass UI. Package com.mediahub.rebuilt versionCode ${C}. Signed release." \
            --target ${{ github.sha }}
