name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediahub-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publish-signed:
    name: Publish signed release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check if tag already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — will build APK artifact only (no new release)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Will create release $TAG"
          fi

      - name: Decrypt signing key
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MEDIAHUB_KEY_ENCRYPTION_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ENCRYPTION_PASSWORD:-}" || { echo "::error::Missing MEDIAHUB_KEY_ENCRYPTION_PASSWORD"; exit 1; }
          test -n "${STORE_PASSWORD:-}" || { echo "::error::Missing MEDIAHUB_KEYSTORE_PASSWORD"; exit 1; }
          test -s signing/mediahub-release.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/mediahub-release.jks.enc \
            -out /tmp/mediahub-release.jks \
            -pass env:ENCRYPTION_PASSWORD
          chmod 600 /tmp/mediahub-release.jks

      - name: Build signed release APK
        env:
          MEDIAHUB_KEYSTORE_PASSWORD: ${{ secrets.MEDIAHUB_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and name APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test "$(stat -c %s "$APK")" -ge $((4 * 1024 * 1024))
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.mediahub.rebuilt'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          OUT="MEDIAHUB-PRO-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEDIAHUB-PRO-v${{ steps.ver.outputs.version_name }}-signed
          path: MEDIAHUB-PRO-v${{ steps.ver.outputs.version_name }}.apk
          retention-days: 30

      - name: Create release with APK (atomic, immutable-safe)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          set -euo pipefail
          NOTES="MEDIAHUB-PRO v${VERSION_NAME}

Premium Liquid Glass UI update.

- Deep dark theme with rose accent
- Redesigned home dashboard (hero + library stats)
- Liquid glass bottom navigation with active pills
- Improved media grid cards
- Package: com.mediahub.rebuilt
- versionCode: ${VERSION_CODE}
- Signed with official MEDIAHUB-PRO release key

Install over the previous version to update."

          gh release create "$TAG" \
            "MEDIAHUB-PRO-v${VERSION_NAME}.apk" \
            --title "MEDIAHUB-PRO v${VERSION_NAME} — Liquid Glass UI" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"

          echo "Published https://github.com/${{ github.repository }}/releases/tag/$TAG"
